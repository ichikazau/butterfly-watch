name: LIS-SKINS browser probe

on:
  push:
    branches: [lis-skins-browser-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install stock Playwright Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Try two public product pages without credentials
        run: |
          python -u - <<'PY'
          import os
          import re
          from decimal import Decimal

          from playwright.sync_api import Error, TimeoutError, sync_playwright

          PRODUCTS = [
              (
                  "★ Talon Knife | Fade (Factory New)",
                  "https://lis-skins.com/market/csgo/%E2%98%85-talon-knife-fade-factory-new/",
              ),
              (
                  "★ Karambit | Doppler Phase 1 (Factory New)",
                  "https://lis-skins.com/market/csgo/%E2%98%85-karambit-doppler-phase-1-factory-new/",
              ),
          ]
          FLOAT = re.compile(r"\b0\.\d{4,}\b")
          PRICE = re.compile(r"\$\s*(\d[\d,]*\.\d{2})")
          WEAR = re.compile(r"\bWEAR\s+(0(?:\.\d+)?)\b", re.IGNORECASE)
          PATTERN = re.compile(r"\bPATTERN\s+(\d{1,4})\b", re.IGNORECASE)

          def read_seed(page, expected_wear):
              description = page.get_by_role("button", name="3D view", exact=True).last
              description.click(timeout=8_000)
              viewer = page.frame_locator('iframe[src*="3dview.cs2inspects"]')
              body = viewer.locator("body")
              body.wait_for(state="attached", timeout=25_000)
              for _ in range(16):
                  details = body.inner_text(timeout=3_000)
                  wear = WEAR.search(details)
                  seed = PATTERN.search(details)
                  if wear and seed:
                      shown_wear = Decimal(wear[1])
                      if abs(shown_wear - expected_wear) <= Decimal("0.0000002"):
                          return int(seed[1])
                  page.wait_for_timeout(750)
              raise ValueError("The 3D viewer did not show a seed with the selected lot's wear")

          def inspect(page, name, url):
              response = page.goto(url, wait_until="domcontentloaded", timeout=25_000)
              if response is None:
                  raise ValueError("Navigation returned no HTTP response")
              title = page.title()
              challenge = response.headers.get("cf-mitigated", "")
              print(f"{name}: status={response.status}, cf-mitigated={challenge or '-'}, title={title!r}")
              product_heading = page.get_by_role("heading", name=name, exact=True, level=1)
              if challenge == "challenge" or re.search(
                  r"just a moment|один момент|security verification",
                  title,
                  re.IGNORECASE,
              ):
                  print("Waiting up to 30 seconds for normal browser verification")
                  try:
                      product_heading.wait_for(timeout=30_000)
                  except TimeoutError:
                      return "BLOCKED: Cloudflare prevented access after 30 seconds of waiting"
              elif response.status >= 400:
                  return f"BLOCKED: HTTP {response.status}"

              product_heading.wait_for(timeout=12_000)
              rows = page.locator(".ui-row--clickable")
              rows.nth(1).wait_for(timeout=10_000)
              offers = []
              for index in range(2):
                  text = rows.nth(index).inner_text(timeout=5_000)
                  wear = FLOAT.search(text)
                  price = PRICE.search(text)
                  if not wear or not price:
                      raise ValueError(f"Row {index + 1} had no readable USD price or float")
                  offers.append((wear[0], Decimal(price[1].replace(",", ""))))
              if offers[0][1] > offers[1][1]:
                  raise ValueError("The first two rows are not sorted by ascending price")

              reported = []
              for index, (wear, price) in enumerate(offers):
                  row = rows.nth(index)
                  row.get_by_text(wear, exact=True).click(timeout=8_000)
                  seed = read_seed(page, Decimal(wear))
                  result = f"#{index + 1} ${price:.2f}, float {wear}, seed {seed}"
                  print(f"{name}: {result}")
                  reported.append(result)
                  page.keyboard.press("Escape")
                  page.keyboard.press("Escape")
              return "OK: " + " / ".join(reported)

          summary = []
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch()
              context = browser.new_context(locale="en-US")
              for name, url in PRODUCTS:
                  page = context.new_page()
                  try:
                      result = inspect(page, name, url)
                  except (Error, ValueError) as exc:
                      result = f"INCONCLUSIVE: {type(exc).__name__}: {str(exc).splitlines()[0]}"
                  finally:
                      page.close()
                  print(f"{name}: {result}")
                  summary.append(f"- **{name}** — {result}")
              browser.close()

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("## Clean Chromium on a GitHub-hosted runner\n\n")
              output.write("\n".join(summary) + "\n")
          PY
