name: Verify additional Telegram recipient
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Send subscription confirmation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_EXTRA_CHAT_IDS: ${{ secrets.TELEGRAM_EXTRA_CHAT_IDS }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          payload=json.dumps({'chat_id':os.environ['TELEGRAM_EXTRA_CHAT_IDS'],'text':'Butterfly Watch: уведомления подключены. Вы будете получать те же сигналы по ценам, что и основной получатель. Это тестовое сообщение.'}).encode()
          req=urllib.request.Request('https://api.telegram.org/bot'+os.environ['TELEGRAM_BOT_TOKEN']+'/sendMessage',data=payload,headers={'Content-Type':'application/json'})
          try:
              with urllib.request.urlopen(req,timeout=25) as r: result=json.load(r)
          except Exception as e:
              print('Delivery failed:',type(e).__name__)
              raise SystemExit(1)
          if not result.get('ok'): raise SystemExit('Telegram rejected message')
          print('Additional recipient delivery confirmed')
          PY
